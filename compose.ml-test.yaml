# Disposable acceptance stack; use scripts.java_acceptance, never a production project name.
services:
  fastapi:
    platform: linux/amd64
    image: ${ML_TEST_IMAGE:-alpha-future-recsys:java-contract}
    environment:
      ML_INTERNAL_API_KEY: ${ML_TEST_API_KEY:?Set test key}
      MODEL_VARIANT: ${ML_TEST_MODEL_VARIANT:-base}
      MODEL_LOCAL_PATH: /models/active
      RECOMMENDATION_MAX_COSINE_DISTANCE: ${ML_TEST_MAX_COSINE_DISTANCE:-}
      SCORING_ENABLED: ${ML_TEST_SCORING_ENABLED:-false}
      SCORING_MODEL_PATH: /models/scoring
    volumes:
      - ${ML_TEST_MODEL_PATH:-./fastapi/models/multilingual-e5-small}:/models/active:ro
      - ${ML_TEST_SCORING_MODEL_PATH:-./fastapi/models/sba-scoring-v2}:/models/scoring:ro
    ports: ["127.0.0.1::8000"]
    mem_limit: 2g
    read_only: true
    tmpfs: ["/tmp:size=64m,mode=1777"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: ["CMD", "python", "-m", "app.healthcheck"]
      interval: 2s
      timeout: 3s
      start_period: 90s
      retries: 5
  backend:
    image: ${ML_TEST_BACKEND_IMAGE:-alpha-future-backend:ml-acceptance}
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/recsys_acceptance
      DB_USER: credit_app
      DB_APP_PASSWORD: ${ML_TEST_DB_APP_PASSWORD:?Set test password}
      DB_MIGRATOR_USER: credit_migrator
      DB_MIGRATOR_PASSWORD: ${ML_TEST_DB_MIGRATOR_PASSWORD:?Set test password}
      SPRING_PROFILES_ACTIVE: demo
      DEMO_PASSWORD: ${ML_TEST_DEMO_PASSWORD:?Set test password}
      DEMO_BANK_PASSWORD: ${ML_TEST_DEMO_PASSWORD:?Set test password}
      DEMO_ASSESSMENT_ENABLED: "false"
      DOCUMENTS_PATH: /app/documents
      RECSYS_URL: http://fastapi:8000/api/v1/recommendations/rank-java
      RECSYS_API_KEY: ${ML_TEST_API_KEY:?Set test key}
      RECSYS_TIMEOUT_MS: "10000"
      SCORING_URL: http://fastapi:8000/api/v1/scoring/evaluate
      SCORING_API_KEY: ${ML_TEST_API_KEY:?Set test key}
      JAVA_TOOL_OPTIONS: "-Xms64m -Xmx384m -XX:+ExitOnOutOfMemoryError"
    ports: ["127.0.0.1::8080"]
    mem_limit: 768m
    read_only: true
    tmpfs:
      - /tmp:size=128m,mode=1777
      - /app/documents:size=64m,mode=0700,uid=10001,gid=10001
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    depends_on:
      fastapi: {condition: service_healthy}
      postgres: {condition: service_healthy}
  postgres:
    image: postgres:17-bookworm
    environment:
      POSTGRES_DB: recsys_acceptance
      POSTGRES_PASSWORD: ${ML_TEST_DB_PASSWORD:?Set test password}
      DB_MIGRATOR_PASSWORD: ${ML_TEST_DB_MIGRATOR_PASSWORD:?Set test password}
      DB_APP_PASSWORD: ${ML_TEST_DB_APP_PASSWORD:?Set test password}
    volumes:
      - test_pgdata:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    mem_limit: 512m
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres", "-d", "recsys_acceptance"]
      interval: 2s
      retries: 30
  frontend:
    profiles: [scoring]
    image: ${ML_TEST_FRONTEND_IMAGE:-alpha-future-frontend:scoring-acceptance}
    ports: ["127.0.0.1::8080"]
    mem_limit: 128m
    read_only: true
    tmpfs: ["/tmp:size=32m,mode=1777"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    depends_on:
      backend: {condition: service_started}
volumes:
  test_pgdata:
