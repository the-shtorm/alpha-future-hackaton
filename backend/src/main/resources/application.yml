spring:
  application:
    name: credit-cabinet
  jackson:
    deserialization:
      fail-on-unknown-properties: true
      use-big-decimal-for-floats: true
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 11MB
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/credit_cabinet}
    username: ${DB_USER:credit_app}
    password: ${DB_APP_PASSWORD}
  flyway:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/credit_cabinet}
    user: ${DB_MIGRATOR_USER:credit_migrator}
    password: ${DB_MIGRATOR_PASSWORD}
    default-schema: credit
    schemas: credit
    locations: classpath:db/migration
    clean-disabled: true
    validate-migration-naming: true
server:
  error:
    include-message: never
    include-stacktrace: never
cabinet:
  documents-path: ${DOCUMENTS_PATH:./work/documents}
  demo-password: ${DEMO_PASSWORD:}
  demo-bank-password: ${DEMO_BANK_PASSWORD:}

  demo-assessment-enabled: ${DEMO_ASSESSMENT_ENABLED:false}
