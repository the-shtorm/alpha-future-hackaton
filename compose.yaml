services:
  frontend:
    build:
      context: ./frontend
    image: alpha-future-frontend:local
    mem_limit: 128m
    ports:
      - '127.0.0.1:${FRONTEND_PORT:-3000}:8080'
    depends_on:
      backend:
        condition: service_started
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    image: alpha-future-backend:local
    mem_limit: 768m
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-credit_cabinet}
      DB_USER: credit_app
      DB_APP_PASSWORD: ${DB_APP_PASSWORD:?Set DB_APP_PASSWORD}
      DB_MIGRATOR_USER: credit_migrator
      DB_MIGRATOR_PASSWORD: ${DB_MIGRATOR_PASSWORD:?Set DB_MIGRATOR_PASSWORD}
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-}
      DEMO_PASSWORD: ${DEMO_PASSWORD:-}
      DEMO_BANK_PASSWORD: ${DEMO_BANK_PASSWORD:-}
      DEMO_ASSESSMENT_ENABLED: ${DEMO_ASSESSMENT_ENABLED:-false}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-false}
      DOCUMENTS_PATH: /app/documents
      RECSYS_URL: ${RECSYS_URL:-http://fastapi:8000/api/v1/recommendations/rank-java}
      RECSYS_API_KEY: ${RECSYS_API_KEY:?Set RECSYS_API_KEY}
      RECSYS_TIMEOUT_MS: ${RECSYS_TIMEOUT_MS:-10000}
      SCORING_URL: ${SCORING_URL:-http://fastapi:8000/api/v1/scoring/evaluate}
      SCORING_API_KEY: ${RECSYS_API_KEY:?Set RECSYS_API_KEY}
    networks:
      - default
      - recsys_internal
    ports:
      - '127.0.0.1:${BACKEND_PORT:-8080}:8080'
    volumes:
      - documents_data:/app/documents
    depends_on:
      postgres:
        condition: service_healthy
      fastapi:
        condition: service_healthy
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=128m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  fastapi:
    platform: linux/amd64
    build:
      context: ./fastapi
      dockerfile: Dockerfile
    image: alpha-future-fastapi:local
    environment:
      ML_INTERNAL_API_KEY: ${RECSYS_API_KEY:?Set RECSYS_API_KEY}
      MODEL_VARIANT: ${RECSYS_MODEL_VARIANT:-finetuned}
      MODEL_PATH: ${MODEL_PATH:-/models/e5-credit-finetune-v1/final}
      HF_CACHE_DIR: /model-cache
      HF_HOME: /model-cache/hf-home
      HF_XET_CACHE: /model-cache/xet
      HF_LOCAL_FILES_ONLY: ${HF_LOCAL_FILES_ONLY:-false}
      HF_TOKEN: ${HF_TOKEN:-}
      S3_ENDPOINT_URL: ${S3_ENDPOINT_URL:-}
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_SESSION_TOKEN: ${AWS_SESSION_TOKEN:-}
      RECOMMENDATION_MAX_COSINE_DISTANCE: ${RECOMMENDATION_MAX_COSINE_DISTANCE:-}
      SCORING_ENABLED: ${SCORING_ENABLED:-true}
      SCORING_MODEL_PATH: ${SCORING_MODEL_PATH:-thedauns/sba-scoring-v2}
    volumes:
      # Share the SELinux label with isolated checks of local model packages.
      - ./fastapi/models:/models:ro,z
      - ./fastapi/models:/scoring-models:ro,z
      - recsys_model_cache:/model-cache
    networks:
      - recsys_internal
      - recsys_egress
    mem_limit: 2g
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "python", "-m", "app.healthcheck"]
      interval: 10s
      timeout: 3s
      start_period: 90s
      retries: 3
    restart: unless-stopped

  postgres:
    image: postgres:17-bookworm
    mem_limit: 512m
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-credit_cabinet}
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:?Copy .env.example to .env}
      DB_MIGRATOR_PASSWORD: ${DB_MIGRATOR_PASSWORD:?Set DB_MIGRATOR_PASSWORD}
      DB_APP_PASSWORD: ${DB_APP_PASSWORD:?Set DB_APP_PASSWORD}
    ports:
      - '127.0.0.1:${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Give this container access to the init scripts on SELinux hosts.
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro,Z
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  pgadmin:
    image: dpage/pgadmin4:9.18
    mem_limit: 384m
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-admin@example.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:?Set PGADMIN_DEFAULT_PASSWORD}
      PGADMIN_DISABLE_POSTFIX: 'true'
    ports:
      - '127.0.0.1:${PGADMIN_PORT:-5050}:80'
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  recsys_model_cache:
  postgres_data:
  pgadmin_data:
  documents_data:

networks:
  recsys_egress:
  recsys_internal:
    internal: true
