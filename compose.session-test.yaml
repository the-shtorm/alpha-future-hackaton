# Disposable local HTTPS acceptance. Run scripts/check_cookie_https.py.
services:
  postgres:
    image: postgres:17-bookworm
    environment:
      POSTGRES_DB: session_acceptance
      POSTGRES_PASSWORD: ${SESSION_TEST_DB_PASSWORD:?Set test password}
      DB_APP_PASSWORD: ${SESSION_TEST_APP_PASSWORD:?Set test password}
      DB_MIGRATOR_PASSWORD: ${SESSION_TEST_MIGRATOR_PASSWORD:?Set test password}
    volumes:
      - test_pgdata:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro,z
    healthcheck:
      test: [CMD, pg_isready, -U, postgres, -d, session_acceptance]
      interval: 2s
      retries: 30
    mem_limit: 512m
  backend:
    image: ${SESSION_TEST_BACKEND_IMAGE:-alpha-future-backend:local}
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/session_acceptance
      DB_USER: credit_app
      DB_APP_PASSWORD: ${SESSION_TEST_APP_PASSWORD:?Set test password}
      DB_MIGRATOR_USER: credit_migrator
      DB_MIGRATOR_PASSWORD: ${SESSION_TEST_MIGRATOR_PASSWORD:?Set test password}
      SPRING_PROFILES_ACTIVE: demo
      DEMO_PASSWORD: ${SESSION_TEST_DEMO_PASSWORD:?Set test password}
      SESSION_COOKIE_SECURE: 'true'
      RECSYS_URL: ''
      DOCUMENTS_PATH: /app/documents
      JAVA_TOOL_OPTIONS: '-Xms64m -Xmx384m -XX:+ExitOnOutOfMemoryError'
    networks: [default, test_front]
    depends_on:
      postgres: {condition: service_healthy}
    read_only: true
    tmpfs:
      - /tmp:size=128m,mode=1777
      - /app/documents:size=64m,mode=0700,uid=10001,gid=10001
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 768m
  frontend:
    image: ${SESSION_TEST_FRONTEND_IMAGE:-alpha-future-frontend:local}
    ports: ['127.0.0.1::8443', '127.0.0.1::8080']
    networks: [test_front]
    volumes:
      - ./infra/session-test/nginx.conf:/etc/nginx/conf.d/default.conf:ro,z
      - ${SESSION_TEST_TLS_DIR:?Set test TLS directory}:/etc/nginx/tls:ro,z
    depends_on: [backend]
    read_only: true
    tmpfs: ['/tmp:size=32m,mode=1777']
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
networks:
  default: {internal: true}
  test_front: {}
volumes:
  test_pgdata:
