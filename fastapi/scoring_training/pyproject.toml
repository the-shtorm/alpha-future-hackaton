[project]
name = "credit-sba-training"
version = "0.1.0"
description = "Isolated CPU SBA credit scoring training; independent of E5 CUDA"
requires-python = ">=3.11,<3.12"
dependencies = [
  "pydantic>=2.10,<3",
  "numpy>=1.26,<3",
  "pandas>=2.2,<3",
  "scikit-learn>=1.5,<2",
  "catboost>=1.2.8,<2",
  "joblib>=1.4,<2",
  "threadpoolctl>=3.5,<4",
]

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-cov>=6,<8", "jsonschema>=4.23,<5", "ruff>=0.9,<1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["..", "."]
addopts = "-q --cov=app.scoring --cov=scoring_training.data --cov-branch --cov-report=term-missing --cov-fail-under=95"

[tool.coverage.report]
exclude_also = ["if __name__ == .__main__.:"]

[tool.ruff]
target-version = "py311"
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B"]
