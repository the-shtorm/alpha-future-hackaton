[project]
name = "credit-recsys"
version = "0.2.0"
description = "Internal CPU semantic ranking service, rank-v2"
requires-python = ">=3.11,<3.12"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.30,<1", "pydantic>=2.10,<3",
  "pydantic-settings>=2.6,<3", "sentence-transformers>=3.4,<6",
  "torch>=2.6,<3", "numpy>=1.26,<3", "anyio>=4.6,<5",
  "huggingface-hub>=0.28,<2", "psutil>=6,<8",
  "catboost==1.2.10", "pandas==2.3.3", "scikit-learn==1.9.1",
]

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-cov>=6,<8", "httpx>=0.28,<1", "jsonschema>=4.23,<5", "ruff>=0.9,<1"]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[tool.uv]
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'", "sys_platform == 'win32' and platform_machine == 'AMD64'"]

[tool.pytest.ini_options]
testpaths = ["tests", "scoring_training/tests"]
markers = ["integration: requires explicitly prepared real model (never downloads)"]
addopts = "-q --cov=app --cov-branch --cov-report=term-missing --cov-report=xml:coverage.xml --cov-report=html:htmlcov --cov-fail-under=95"

[tool.coverage.report]
exclude_also = ["if __name__ == .__main__.:"]

[tool.ruff]
target-version = "py311"
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B"]
