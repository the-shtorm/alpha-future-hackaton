name: Recsys contract tests
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.10.2'
          enable-cache: true
          cache-dependency-glob: fastapi/uv.lock
      - run: uv sync --frozen --python 3.11
        working-directory: fastapi
      - run: uv run --frozen ruff check app scripts tests
        working-directory: fastapi
      - run: uv run --frozen python -m pytest --junitxml=reports/junit.xml
        working-directory: fastapi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: recsys-unit-reports
          path: |
            fastapi/reports/junit.xml
            fastapi/coverage.xml
  real-java:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.10.2'
      - run: uv sync --frozen --python 3.11
        working-directory: fastapi
      - run: uv run --frozen python -m scripts.prepare_model
        working-directory: fastapi
      - run: docker build --target runtime -t alpha-future-recsys:java-contract ./fastapi
      - run: docker build -t alpha-future-backend:ml-acceptance .
      - run: uv run --frozen python -m scripts.java_acceptance
        working-directory: fastapi
      - name: Real offline tests in Linux
        run: |
          docker build --target test -t alpha-future-recsys:tests ./fastapi
          docker run --rm --network none --memory 2g --read-only --tmpfs /tmp:size=64m -e RUN_REAL_MODEL_TESTS=1 -e MODEL_LOCAL_PATH=/models/multilingual-e5-small -v "$PWD/fastapi/models/multilingual-e5-small:/models/multilingual-e5-small:ro" alpha-future-recsys:tests python -m pytest -o addopts='' -v
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: real-java-ml-acceptance
          path: work/ml-acceptance/
