name: Recsys contract tests
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.10.2'
          enable-cache: true
          cache-dependency-glob: fastapi/uv.lock
      - run: uv sync --frozen --python 3.11
        working-directory: fastapi
      - run: uv run --frozen ruff check app scripts tests
        working-directory: fastapi
      - run: uv run --frozen python -m pytest --junitxml=reports/junit.xml
        working-directory: fastapi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: recsys-unit-reports
          path: |
            fastapi/reports/junit.xml
            fastapi/coverage.xml
  model-package:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.10.2'
          enable-cache: true
          cache-dependency-glob: fastapi/uv.lock
      - run: git lfs fsck
      - run: uv sync --frozen --no-dev --python 3.11
        working-directory: fastapi
      - name: Verify published model and run offline CPU smoke
        run: uv run --frozen --no-dev python -m scripts.verify_model --smoke
        working-directory: fastapi
        env:
          HF_HUB_OFFLINE: '1'
          TRANSFORMERS_OFFLINE: '1'
  real-java:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.10.2'
      - run: uv sync --frozen --python 3.11
        working-directory: fastapi
      - run: uv run --frozen python -m scripts.prepare_model
        working-directory: fastapi
      - run: docker build --target runtime -t alpha-future-recsys:java-contract ./fastapi
      - run: docker build -t alpha-future-backend:ml-acceptance .
      - run: uv run --frozen python -m scripts.java_acceptance --output ../work/ml-acceptance/java-base-e2e.json
        working-directory: fastapi
      - run: uv run --frozen python -m scripts.java_acceptance --model-variant finetuned --output ../work/ml-acceptance/java-finetuned-e2e.json
        working-directory: fastapi
      - name: Real offline tests in Linux
        run: |
          docker build --target test -t alpha-future-recsys:tests ./fastapi
          docker run --rm --network none --memory 2g --read-only --tmpfs /tmp:size=64m -e RUN_REAL_MODEL_TESTS=1 -e RUN_FINETUNED_MODEL_TESTS=1 -v "$PWD/fastapi/models/multilingual-e5-small:/app/models/multilingual-e5-small:ro" -v "$PWD/fastapi/models/e5-credit-finetune-v1/final:/app/models/e5-credit-finetune-v1/final:ro" alpha-future-recsys:tests python -m pytest -o addopts='' -v
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: real-java-ml-acceptance
          path: work/ml-acceptance/
  scoring-model:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SCORING_MODEL_PATH: ${{ vars.SCORING_MODEL_PATH || 'thedauns/sba-scoring-v2' }}
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.10.2'
      - run: uv sync --frozen --python 3.11
        working-directory: fastapi
      - name: Verify the public pinned HF scoring package and native inference
        run: uv run --frozen python -m scripts.prepare_scoring_model --smoke
        working-directory: fastapi
      - name: Offline scoring package and API tests
        run: uv run --frozen python -m pytest tests/integration/test_scoring_v2_package.py -o addopts='' -q
        working-directory: fastapi
        env:
          HF_LOCAL_FILES_ONLY: 'true'
          RUN_SCORING_INTEGRATION: '1'
