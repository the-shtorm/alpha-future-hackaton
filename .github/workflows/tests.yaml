name: Tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  fastapi:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: fastapi/requirements*.txt
      - run: python -m pip install -r requirements-test.txt
        working-directory: fastapi
      - run: python -m pytest --junitxml=junit.xml
        working-directory: fastapi
      - name: Check runtime image with a cloud port
        run: |
          docker build --target runtime -t fastapi-smoke ./fastapi
          docker run -d --name fastapi-smoke --read-only --tmpfs /tmp:size=64m --cap-drop ALL --security-opt no-new-privileges:true -e PORT=8080 -p 127.0.0.1:18080:8080 fastapi-smoke
          # A published Docker port can reset connections while Uvicorn starts.
          curl --fail --retry 20 --retry-all-errors --retry-delay 1 --retry-max-time 45 --max-time 2 http://127.0.0.1:18080/health
          docker exec fastapi-smoke python -m app.healthcheck
      - name: Remove smoke container
        if: always()
        run: |
          docker logs fastapi-smoke || true
          docker rm -f fastapi-smoke || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fastapi-test-reports
          path: |
            fastapi/coverage.xml
            fastapi/htmlcov/
            fastapi/junit.xml
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: mvn --batch-mode --no-transfer-progress -f backend/pom.xml verify
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-test-reports
          path: |
            backend/target/surefire-reports/
            backend/target/site/jacoco/
  cloud-manifests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          kubectl kustomize infra/kubernetes/fastapi > /tmp/fastapi.yaml
          kubectl kustomize infra/kubernetes/migrations > /tmp/migrations.yaml
          docker run --rm -v /tmp:/manifests:ro ghcr.io/yannh/kubeconform:v0.7.0 -strict -summary /manifests/fastapi.yaml /manifests/migrations.yaml
          docker compose --env-file .env.example config --quiet
          docker compose -f compose.test.yaml config --quiet
